[package]
name = "sumire"
version = "0.5.0"
description = "Sumire — AI 共著デスクトップ執筆環境"
authors = ["Claudy Cat"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/claudycat-ai/Sumire"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sumire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-window-state = "2.4.1"
# OS keychain アクセス。keyring-core + windows-native-keyring-store の
# 構成を採用(2026-05-10)。保存先を set_default_store で明示する。
# 当時は「keyring v3 は Windows で動かない」と見立てたが、2026-11-18 に確かめ直すと、
# v3 に feature(windows-native)を付けていなかったため mock の保存先に落ちていた
# だけだった(src/commands/secrets.rs の冒頭のコメント)。
keyring-core = "0.7"
windows-native-keyring-store = "0.5"
# プロバイダ通信を Rust 経由で行うための HTTP クライアント(provider-http-rust)。
# 既定 feature の native-tls のままにし、TLS 検証は OS の証明書ストア
# (Windows は SChannel)で行う。移行前の WebView と同じく、OS に入れた社内 CA
# や LAN 用の証明書が通る。`stream` は本文を bytes_stream() で逐次読むため。
# 0.12 系はスパイクで逐次ストリーミングと中断を確認済み。lockfile にある 0.13 は
# Windows ではビルドされない tauri の任意依存で、並ぶのは意図どおり。
reqwest = { version = "0.12", features = ["stream"] }
# bytes_stream() を StreamExt::next で逐次読み出すため。
futures-util = "0.3"

# llama-server を入れるジョブオブジェクト(llama-server-provider)。Sumire が強制終了
# されても、OS が子プロセスを終了させる。
[target.'cfg(windows)'.dependencies]
win32job = "2"
